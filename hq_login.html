<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Master Login | ClinicOS HQ</title>
    <link rel="icon" type="image/x-icon" href="https://img.icons8.com/fluency-systems-filled/48/228BE6/hospital-2.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet"/>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { 'body': ['Manrope', 'sans-serif'] } } } }
    </script>
    <style>
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#020617] font-body text-slate-300 min-h-screen flex items-center justify-center relative overflow-hidden selection:bg-amber-500 selection:text-white">

    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-amber-500/10 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="w-full max-w-md p-8 sm:p-12 bg-[#0f172a]/80 backdrop-blur-xl rounded-[2.5rem] shadow-2xl border border-white/10 relative z-10 fade-in">
        
        <div id="errorBanner" class="hidden absolute -top-4 left-1/2 transform -translate-x-1/2 bg-red-500/20 border border-red-500/50 text-red-400 px-4 py-2 rounded-xl text-xs font-bold shadow-md whitespace-nowrap flex items-center gap-2">
            <span class="material-symbols-outlined text-[16px]">error</span> <span id="errorText">Access Denied</span>
        </div>

        <div class="flex flex-col items-center text-center mb-10">
            <div class="w-16 h-16 bg-gradient-to-br from-amber-400 to-orange-600 rounded-2xl flex items-center justify-center shadow-lg mb-4 shadow-orange-500/30">
                <span class="material-symbols-outlined text-white text-3xl">admin_panel_settings</span>
            </div>
            <h1 class="text-3xl font-black text-white tracking-tight">HQ Command</h1>
            <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mt-2">Super Admin Authentication</p>
        </div>
        
        <form id="hqLoginForm" class="space-y-6">
            <div>
                <label class="block text-[10px] font-black text-slate-500 uppercase tracking-wider mb-2">Master Email</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-3.5 text-slate-500 text-[20px]">shield_person</span>
                    <input type="email" id="adminEmail" placeholder="admin@clinicos.com" class="w-full pl-12 pr-4 py-3.5 bg-[#020617] border border-white/10 rounded-2xl outline-none focus:border-amber-500 text-white font-bold transition-all" required>
                </div>
            </div>
            <div>
                <label class="block text-[10px] font-black text-slate-500 uppercase tracking-wider mb-2">Security Key (Password)</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-3.5 text-slate-500 text-[20px]">key</span>
                    <input type="password" id="adminPwd" placeholder="••••••••" class="w-full pl-12 pr-4 py-3.5 bg-[#020617] border border-white/10 rounded-2xl outline-none focus:border-amber-500 text-white font-bold transition-all" required>
                </div>
            </div>
            
            <button type="submit" id="btnAuth" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-black py-4 rounded-2xl shadow-[0_0_20px_rgba(245,158,11,0.3)] hover:shadow-[0_0_30px_rgba(245,158,11,0.5)] hover:-translate-y-0.5 transition-all duration-300 mt-2 flex items-center justify-center gap-2">
                Initialize System <span class="material-symbols-outlined text-[18px]">login</span>
            </button>
        </form>

        <p class="text-center text-[10px] font-bold text-slate-500 mt-8 cursor-pointer hover:text-amber-400 transition-colors" onclick="createMasterKey()">First time setup? Create Master Key.</p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyBBk6vekMZZNQnwyT2IbgIypv4dKN2NFpA", authDomain: "clinic-os-d280b.firebaseapp.com", projectId: "clinic-os-d280b" };
        firebase.initializeApp(firebaseConfig); 
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Silent check on load
        auth.onAuthStateChanged(async (user) => { 
            if(user) {
                try {
                    const doc = await db.collection("users").doc(user.uid).get();
                    if(doc.exists && doc.data().role === 'super_admin') window.location.href = 'superadmin_hq.html';
                } catch(e) { console.error(e); }
            }
        });

        document.getElementById('hqLoginForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnAuth'); const originalText = btn.innerHTML;
            const errorBanner = document.getElementById('errorBanner');
            
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin text-[18px]">sync</span> Verifying...`; btn.disabled = true; errorBanner.classList.add('hidden');

            try {
                const userCredential = await auth.signInWithEmailAndPassword(document.getElementById('adminEmail').value, document.getElementById('adminPwd').value);
                
                // Double Admin Security Check
                const userDoc = await db.collection("users").doc(userCredential.user.uid).get();
                if (userDoc.exists && userDoc.data().role === 'super_admin') {
                    window.location.href = 'superadmin_hq.html';
                } else {
                    await auth.signOut();
                    throw new Error("You are not authorized as a Super Admin.");
                }
            } catch (error) {
                document.getElementById('errorText').innerText = "Access Denied! " + error.message;
                errorBanner.classList.remove('hidden'); errorBanner.classList.add('animate-bounce');
                setTimeout(() => errorBanner.classList.remove('animate-bounce'), 1000);
            } finally { btn.innerHTML = originalText; btn.disabled = false; }
        };

        window.createMasterKey = async () => {
            const email = prompt("Enter Master Admin Email to register:");
            const pwd = prompt("Enter Master Security Key (Password):");
            if(email && pwd) {
                try {
                    const cred = await auth.createUserWithEmailAndPassword(email, pwd);
                    alert("Auth user created! Please add UID: " + cred.user.uid + " to Firestore 'users' collection to grant Admin Access.");
                } catch(e) { alert("Error: " + e.message); }
            }
        };
    </script>
</body>
</html>
